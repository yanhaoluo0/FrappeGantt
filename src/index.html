<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#06131a" />
        <title>时序任务管理</title>
    </head>
    <body class="is-booting">
        <div id="boot-screen" class="boot-screen" aria-hidden="true">
            <div class="boot-grid"></div>
            <div class="boot-glow"></div>
            <div class="boot-core">
                <div class="boot-mark">
                    <svg viewBox="0 0 96 96" role="presentation">
                        <rect x="8" y="8" width="80" height="80" rx="22"></rect>
                        <path d="M25 28h37M25 48h50M25 68h29"></path>
                        <circle cx="72" cy="28" r="5"></circle>
                        <circle cx="82" cy="48" r="5"></circle>
                        <circle cx="61" cy="68" r="5"></circle>
                    </svg>
                </div>
                <p class="boot-kicker">项目时序引擎</p>
                <p class="boot-title">时序任务管理</p>
                <div class="boot-progress"><span></span></div>
                <p class="boot-status">正在载入任务与时间线</p>
            </div>
        </div>

        <div class="app-shell">
            <header class="app-header">
                <div class="brand-block">
                    <div class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 42 42" role="presentation">
                            <rect x="2" y="2" width="38" height="38" rx="11"></rect>
                            <path d="M11 13h15M11 21h20M11 29h11"></path>
                            <circle cx="31" cy="13" r="2.5"></circle>
                            <circle cx="35" cy="21" r="2.5"></circle>
                            <circle cx="26" cy="29" r="2.5"></circle>
                        </svg>
                    </div>
                    <div>
                        <p class="eyebrow">项目时序控制台</p>
                        <div class="title-row">
                            <h1>时序任务管理</h1>
                            <span
                                id="save-status"
                                class="save-status"
                                role="status"
                                >数据保存在本机</span
                            >
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <span class="edit-hint">
                        <span class="hint-signal" aria-hidden="true"></span>
                        拖动自动保存 · 控制键滚动切换时间粒度
                    </span>
                    <button id="new-task-button" class="primary-button" type="button">
                        <svg
                            class="button-icon"
                            viewBox="0 0 20 20"
                            aria-hidden="true"
                        >
                            <path d="M10 4v12M4 10h12"></path>
                        </svg>
                        新建任务
                    </button>
                </div>
            </header>

            <main class="workspace">
                <section class="timeline-panel" aria-label="任务甘特图">
                    <div class="timeline-toolbar">
                        <div class="timeline-heading">
                            <span class="live-indicator" aria-hidden="true"></span>
                            <span>计划时间线</span>
                            <span id="task-count" class="task-count">0 项任务</span>
                        </div>
                        <div class="status-legend" aria-label="任务状态统计">
                            <span class="legend-item legend-completed">
                                <i aria-hidden="true"></i>完成
                                <strong id="count-completed">0</strong>
                            </span>
                            <span class="legend-item legend-pending">
                                <i aria-hidden="true"></i>未完成
                                <strong id="count-pending">0</strong>
                            </span>
                            <span class="legend-item legend-delayed">
                                <i aria-hidden="true"></i>延期
                                <strong id="count-delayed">0</strong>
                            </span>
                            <span class="legend-item legend-on-hold">
                                <i aria-hidden="true"></i>搁置
                                <strong id="count-on-hold">0</strong>
                            </span>
                        </div>
                    </div>

                    <div class="timeline-stage">
                        <div id="gantt" class="gantt-host"></div>
                        <div id="empty-state" class="empty-state">
                            <div class="empty-mark" aria-hidden="true">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <p class="empty-kicker">当前暂无任务</p>
                            <h2>创建首项任务</h2>
                            <p>设置任务名称、时间范围与依赖关系，拖动任务条即可调整计划。</p>
                            <button id="empty-create-button" type="button">
                                创建首项任务
                            </button>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <dialog id="task-dialog" class="task-dialog">
            <form id="task-form" novalidate>
                <header class="dialog-header">
                    <div>
                        <p class="eyebrow">任务详情</p>
                        <h2 id="dialog-title">新建任务</h2>
                    </div>
                    <button
                        id="dialog-cancel-icon"
                        class="icon-button"
                        type="button"
                        aria-label="关闭"
                    >
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M5 5l10 10M15 5 5 15"></path>
                        </svg>
                    </button>
                </header>

                <div class="form-body">
                    <label class="field field-wide">
                        <span>任务名称</span>
                        <input
                            id="task-name"
                            name="name"
                            type="text"
                            maxlength="120"
                            autocomplete="off"
                            required
                        />
                    </label>

                    <div class="date-fields">
                        <label class="field">
                            <span>开始日期</span>
                            <input
                                id="task-start"
                                name="start"
                                type="date"
                                required
                            />
                        </label>
                        <label class="field">
                            <span>结束日期</span>
                            <input
                                id="task-end"
                                name="end"
                                type="date"
                                required
                            />
                        </label>
                    </div>

                    <fieldset class="field field-wide status-field">
                        <legend>状态</legend>
                        <div class="status-options">
                            <label class="status-choice status-choice-completed">
                                <input
                                    type="radio"
                                    name="status"
                                    value="completed"
                                />
                                <span class="status-dot" aria-hidden="true"></span>
                                <span>完成</span>
                            </label>
                            <label class="status-choice status-choice-pending">
                                <input
                                    type="radio"
                                    name="status"
                                    value="pending"
                                    checked
                                />
                                <span class="status-dot" aria-hidden="true"></span>
                                <span>未完成</span>
                            </label>
                            <label class="status-choice status-choice-delayed">
                                <input
                                    type="radio"
                                    name="status"
                                    value="delayed"
                                />
                                <span class="status-dot" aria-hidden="true"></span>
                                <span>延期</span>
                            </label>
                            <label class="status-choice status-choice-on-hold">
                                <input
                                    type="radio"
                                    name="status"
                                    value="on_hold"
                                />
                                <span class="status-dot" aria-hidden="true"></span>
                                <span>搁置</span>
                            </label>
                        </div>
                    </fieldset>

                    <label class="field">
                        <span class="field-label-row">
                            <span>进度</span>
                            <output id="progress-output" for="task-progress"
                                >0%</output
                            >
                        </span>
                        <input
                            id="task-progress"
                            name="progress"
                            type="range"
                            min="0"
                            max="100"
                            step="1"
                            value="0"
                        />
                    </label>

                    <label class="field">
                        <span>前置任务</span>
                        <select
                            id="task-dependencies"
                            name="dependencies"
                            multiple
                            size="5"
                        ></select>
                        <small>按住键盘控制键可多选；不选择表示没有前置任务。</small>
                    </label>

                    <label class="field field-wide">
                        <span>备注</span>
                        <textarea
                            id="task-notes"
                            name="notes"
                            rows="4"
                            maxlength="2000"
                            placeholder="填写任务范围、交付说明或补充信息"
                        ></textarea>
                    </label>

                    <p id="form-error" class="form-error" role="alert"></p>
                </div>

                <footer class="dialog-footer">
                    <button
                        id="delete-task-button"
                        class="danger-button"
                        type="button"
                        hidden
                    >
                        删除任务
                    </button>
                    <div class="footer-spacer"></div>
                    <button id="dialog-cancel" class="quiet-button" type="button">
                        取消
                    </button>
                    <button id="save-task-button" class="primary-button" type="submit">
                        保存任务
                    </button>
                </footer>
            </form>
        </dialog>

        <script type="module" src="/main.js"></script>
    </body>
</html>
